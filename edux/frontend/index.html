<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Modux - Plataforma de gestión académica e institucional multiinstitución." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#001229" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000914" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
    />
    <title>Modux - Portal Académico Institucional</title>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('modux-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface dark:bg-[#000914] dark:text-[#f8f9ff] antialiased selection:bg-primary-600 selection:text-white font-['Atkinson_Hyperlegible','Plus_Jakarta_Sans',sans-serif]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
