server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router usa history mode. Todas las rutas de la aplicación deben
    # resolver al index para que una recarga directa no produzca un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
