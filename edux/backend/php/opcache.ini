; ============================================================
; php/opcache.ini — OPcache optimizado para producción
; ============================================================

[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0

; Memoria para el bytecode cacheado (MB)
opcache.memory_consumption     = 256

; Memoria para strings internados (MB)
opcache.interned_strings_buffer = 16

; Máximo de archivos PHP cacheados
opcache.max_accelerated_files  = 20000

; En producción: DESHABILITAR revalidación de timestamps
; (0 = nunca revalida → máximo rendimiento)
; Reiniciar php-fpm para ver cambios de código
opcache.revalidate_freq        = 0
opcache.validate_timestamps    = 0

; Guardar comentarios de archivos (requerido por algunas anotaciones)
opcache.save_comments          = 1

; JIT Compiler (PHP 8+) — tracing es el modo más agresivo
opcache.jit                    = tracing
; Memoria para el buffer JIT (MB)
opcache.jit_buffer_size        = 64M

; Registrar estadísticas de OPcache (útil para monitoreo)
opcache.enable_file_override   = 0

; Proteger contra la modificación de archivos maliciosos
opcache.file_cache_consistency_checks = 1
