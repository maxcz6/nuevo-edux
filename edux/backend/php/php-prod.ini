; ============================================================
; php/php-prod.ini — php.ini optimizado para producción
; ============================================================

[PHP]
; ── Seguridad ─────────────────────────────────────────────────
; Ocultar la versión de PHP en cabeceras HTTP
expose_php = Off

; Deshabilitar funciones peligrosas
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,\
    parse_ini_file,show_source,pcntl_exec

; No mostrar errores al usuario
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /var/www/html/storage/logs/php-error.log

; Nivel de reporte de errores en producción
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Subida de archivos ────────────────────────────────────────
file_uploads      = On
upload_max_filesize = 50M
post_max_size       = 55M
max_file_uploads    = 20

; ── Rendimiento ───────────────────────────────────────────────
; Tiempo máximo de ejecución de un script (segundos)
max_execution_time  = 120
max_input_time      = 60

; Memoria máxima por proceso PHP
memory_limit        = 256M

; ── Sesiones ─────────────────────────────────────────────────
; Laravel gestiona sesiones vía Redis; dejar el driver por defecto
session.gc_maxlifetime = 7200

; ── Zona horaria ──────────────────────────────────────────────
date.timezone = America/Lima

; ── Codificación ──────────────────────────────────────────────
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8
