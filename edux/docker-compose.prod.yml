# ============================================================
# docker-compose.prod.yml — Stack de PRODUCCIÓN
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# NUNCA montar código fuente como volumen.
# El código va DENTRO de las imágenes (multi-stage build).
# Variables de entorno exclusivamente via .env.prod
# ============================================================

services:

  # ──────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: aula_postgres_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      # init.sql solo se ejecuta si el volumen está vacío (primer arranque)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Sin ports: → la DB NO está accesible desde el host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aula_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    # Sin ports: → Redis NO está accesible desde el host
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Laravel Backend (PHP-FPM)
  # ──────────────────────────────────────────
  backend:
    image: aula-backend-prod:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: aula_backend_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      # Solo persistir storage (uploads, logs) — NO el código fuente
      - storage_data_prod:/var/www/html/storage/app
      - logs_data_prod:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Queue Worker
  # ──────────────────────────────────────────
  worker:
    image: aula-backend-prod:latest
    container_name: aula_worker_prod
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
    env_file:
      - .env.prod
    volumes:
      - storage_data_prod:/var/www/html/storage/app
      - logs_data_prod:/var/www/html/storage/logs
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor redis --max=100 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Scheduler (php artisan schedule:run cada minuto)
  # ──────────────────────────────────────────
  scheduler:
    image: aula-backend-prod:latest
    container_name: aula_scheduler_prod
    restart: always
    # Loop shell: ejecuta schedule:run cada 60 segundos
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction >> /var/www/html/storage/logs/scheduler.log 2>&1;
        sleep 60;
      done"
    env_file:
      - .env.prod
    volumes:
      - storage_data_prod:/var/www/html/storage/app
      - logs_data_prod:/var/www/html/storage/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Frontend estático (Vue 3 + Vite build)
  # ──────────────────────────────────────────
  frontend:
    image: aula-frontend-prod:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: aula_frontend_prod
    restart: always
    # Sin ports: nginx actúa de proxy/sirve los assets directamente
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aula_net_prod

  # ──────────────────────────────────────────
  # Nginx 1.27 — Reverse proxy + static assets
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aula_nginx_prod
    restart: always
    ports:
      - "80:80"
      # Habilitar 443 cuando tengas certificados TLS:
      # - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Archivos públicos de Laravel (storage symlink)
      - storage_data_prod:/var/www/html/storage/app:ro
      # Descomentar para TLS:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aula_net_prod

# ──────────────────────────────────────────
# Volúmenes nombrados (datos persistentes)
# ──────────────────────────────────────────
volumes:
  pgdata_prod:
    driver: local
  redis_data_prod:
    driver: local
  storage_data_prod:
    driver: local
  logs_data_prod:
    driver: local

# ──────────────────────────────────────────
# Red interna (aislada del host)
# ──────────────────────────────────────────
networks:
  aula_net_prod:
    driver: bridge
