# ============================================================
# nginx/prod.conf — Configuración de PRODUCCIÓN
# Versión: nginx 1.27-alpine
# ============================================================

# ── Límites globales ────────────────────────────────────────
client_max_body_size 50M;
client_body_timeout  60s;
client_header_timeout 30s;
keepalive_timeout    65s;
send_timeout         60s;

# ── Gzip ────────────────────────────────────────────────────
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_buffers      16 8k;
gzip_http_version 1.1;
gzip_min_length   256;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # Assets del frontend (dist de Vite)
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS: 1 año — SOLO activar cuando el sitio corre en HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP básico — ajusta según los orígenes reales de tu app
    add_header Content-Security-Policy
        "default-src 'self';
         script-src  'self' 'unsafe-inline' 'unsafe-eval';
         style-src   'self' 'unsafe-inline';
         img-src     'self' data: blob:;
         font-src    'self' data:;
         connect-src 'self';
         frame-ancestors 'none';"
        always;

    # ── Bloquear archivos sensibles ───────────────────────────
    location ~ /\.env           { deny all; return 404; }
    location ~ /\.git           { deny all; return 404; }
    location ~ /composer\.json  { deny all; return 404; }
    location ~ /composer\.lock  { deny all; return 404; }
    location ~ /package\.json   { deny all; return 404; }
    location ~ /\.ht            { deny all; return 404; }

    # ── Endpoint de salud para el healthcheck de Docker ───────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Assets de Vite (JS/CSS/fonts/images con hash) ─────────
    # Vite genera nombres con hash → inmutable cache 1 año
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Storage público de Laravel ────────────────────────────
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    # ── API Laravel → PHP-FPM ─────────────────────────────────
    location ^~ /api/ {
        fastcgi_pass backend:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param SERVER_NAME     $host;
        include fastcgi_params;

        fastcgi_read_timeout  120s;
        fastcgi_send_timeout  120s;
        fastcgi_connect_timeout 10s;

        fastcgi_buffer_size    128k;
        fastcgi_buffers        8 128k;
        fastcgi_busy_buffers_size 256k;

        # Ocultar versión de PHP al cliente
        fastcgi_hide_header X-Powered-By;

        # No cachear respuestas de API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Sanctum / Auth routes ─────────────────────────────────
    location ^~ /sanctum/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
    }

    # ── SPA fallback (Vue Router history mode) ────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Sin cache para index.html (el browser debe pedir siempre la última versión)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/access.log combined buffer=512k flush=5s;
    error_log  /var/log/nginx/error.log warn;
}
