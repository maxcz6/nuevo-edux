services:
  database:
    image: postgres:16-alpine
    container_name: aula_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: aula_virtual
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula_virtual"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aula_net

  redis:
    image: redis:7-alpine
    container_name: aula_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aula_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: aula_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - aula_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aula_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage/app
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aula_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aula_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage/app
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aula_net

  frontend:
    image: aula-frontend-dev:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: aula_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host
    networks:
      - aula_net

  nginx:
    image: nginx:1.27-alpine
    container_name: aula_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aula_net

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    image: aula-e2e:latest
    container_name: aula_e2e
    environment:
      - PLAYWRIGHT_BASE_URL=http://nginx
    depends_on:
      - nginx
    networks:
      - aula_net
    profiles: ["testing"]
    command: npx playwright test

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  node_modules:
  backend_vendor:

networks:
  aula_net:
    driver: bridge
