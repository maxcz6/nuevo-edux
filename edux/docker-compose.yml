services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aula_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage/app
    environment:
      APP_ENV: local
      APP_KEY: base64:placeholder_run_php_artisan_key_generate
      APP_DEBUG: true
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: aula_virtual
      DB_USERNAME: postgres
      DB_PASSWORD: secret_password
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@aulav.local
      MAIL_FROM_NAME: "Aula Virtual"
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:8080
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aula_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aula_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage/app
    environment:
      APP_ENV: local
      APP_KEY: base64:placeholder_run_php_artisan_key_generate
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: aula_virtual
      DB_USERNAME: postgres
      DB_PASSWORD: secret_password
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
    networks:
      - aula_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aula_frontend
    restart: unless-stopped
    networks:
      - aula_net

  nginx:
    image: nginx:1.27-alpine
    container_name: aula_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aula_net

  database:
    image: postgres:16-alpine
    container_name: aula_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: aula_virtual
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aula_net

  redis:
    image: redis:7-alpine
    container_name: aula_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aula_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: aula_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - aula_net

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  aula_net:
    driver: bridge
